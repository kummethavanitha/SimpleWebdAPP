apiVersion: v1
kind: Service
metadata:
  name: my-web-app-service
spec:
  selector:
    app: my-app  # This should match the label in your Deployment
  ports:
    - protocol: TCP
      port: 80       # Port the Service will listen on
      targetPort: 80  # Port inside the container
      nodePort: 30007 # The port you want to expose on your localhost
  type: NodePort

